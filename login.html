<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login • Painel ROTA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','system-ui','Segoe UI','Roboto','Arial'] }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#e5e7eb;
      background:
        radial-gradient(circle at 20% 0%, rgba(250,204,21,.12), transparent 55%),
        radial-gradient(circle at 80% 10%, rgba(96,165,250,.10), transparent 52%),
        radial-gradient(circle at top, #0b1120 0%, #020617 56%, #000 100%);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:100%;
      max-width:360px;
      background:rgba(15,23,42,.9);
      border-radius:18px;
      border:1px solid rgba(148,163,184,.3);
      padding:18px 18px 16px;
      box-shadow:0 18px 50px rgba(0,0,0,.6);
    }
    .input{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(148,163,184,.35);
      background:rgba(15,23,42,.8);
      color:#e5e7eb;
      padding:9px 10px;
      font-size:14px;
      margin-bottom:10px;
      outline:none;
    }
    .input:focus{
      border-color:rgba(250,204,21,.7);
      box-shadow:0 0 0 3px rgba(250,204,21,.16);
    }
    .btn{
      width:100%;
      border-radius:999px;
      border:1px solid rgba(250,204,21,.7);
      background:rgba(250,204,21,.12);
      color:#facc15;
      padding:9px 10px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 0 0 4px rgba(250,204,21,.08);
    }
    .btn:active{ transform:translateY(1px); }
    .msg{
      font-size:12px;
      margin-top:8px;
      min-height:16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="width:34px;height:34px;border-radius:999px;border:2px solid #facc15;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#facc15;">RT</div>
      <div>
        <div style="font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;">ROTA • Painel Interno</div>
        <div style="font-size:11px;color:#9ca3af;">Login para PA / Sub / Cmd / Coordop</div>
      </div>
    </div>

    <form id="login-form">
      <input id="email" class="input" type="email" placeholder="E-mail" required />
      <input id="password" class="input" type="password" placeholder="Senha" required />
      <button type="submit" class="btn" id="btn-login">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    // MESMA CONFIG DO PAINEL
    const SUPABASE_URL = "https://ilonwkgtdszmpcjwlezc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlsb253a2d0ZHN6bXBjandsZXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5NzQxMDIsImV4cCI6MjA3NTU1MDEwMn0.Cc-BtnHlXaGVCY6T6iXe0QA1tsfc17aX8lswEICvtw0";

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn-login");

    // Se já estiver logado, pula o login e vai direto pro painel
    document.addEventListener("DOMContentLoaded", async () => {
      const { data, error } = await sb.auth.getSession();
      if (data?.session?.user) {
        window.location.href = "Painel Compania.html"; // mesmo nome do seu painel
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btn.disabled = true;
      btn.textContent = "Entrando...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        console.error(error);
        msg.textContent = "Falha no login: verifique e-mail e senha.";
        btn.disabled = false;
        btn.textContent = "Entrar";
        return;
      }

      // Sucesso → a sessão é salva automaticamente (persistSession padrão = true)
      msg.textContent = "Login bem-sucedido, redirecionando...";
      window.location.href = "Painel Compania.html";
    });
  </script>
</body>
</html>
