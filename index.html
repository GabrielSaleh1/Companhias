<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROTA • Companhias (ULTRA)</title>
<style>
body{margin:0;font-family:Arial;background:#0b0f16;color:#e5e7eb;}
.sidebar{width:260px;position:fixed;top:0;bottom:0;left:0;background:rgba(255,255,255,.04);backdrop-filter:blur(12px);border-right:1px solid rgba(255,255,255,.1);padding:20px;}
.content{margin-left:260px;padding:30px;}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:16px;margin-bottom:20px;}
.table{width:100%;border-collapse:collapse;}
.table th,.table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.1);}
.btn{padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e5e7eb;cursor:pointer;}
.btn:hover{background:rgba(255,255,255,.12);}
.nav-btn{display:block;margin-bottom:10px;padding:10px;border-radius:10px;color:#e5e7eb;text-decoration:none;}
.nav-btn:hover{background:rgba(255,255,255,.12);}
</style>
</head>
<body>

<div class="sidebar">
<h2>ROTA • Painel</h2>
<a class="nav-btn" onclick="showView('dashboard')">Dashboard</a>
<a class="nav-btn" onclick="showView('registros')">Registros</a>
<a class="nav-btn" onclick="showView('alfa')">Caveiras</a>
<a class="nav-btn" onclick="showView('bravo')">Boinas Pretas</a>
<button class="btn" onclick="logout()">Sair</button>
</div>

<div class="content">

<div id="dashboard" class="view">
  <div class="card"><h3>Pendentes:</h3><div id="stat-pendente">0</div></div>
  <div class="card"><h3>Em análise:</h3><div id="stat-analise">0</div></div>
  <div class="card"><h3>Resolvidos:</h3><div id="stat-resolvido">0</div></div>
  <div class="card"><h3>Arquivados:</h3><div id="stat-arquivado">0</div></div>
</div>

<div id="registros" class="view" style="display:none">
  <div class="card">
    <h3>Registros gerais</h3>
    <table class="table"><thead><tr><th>Data</th><th>Policial</th><th>Cia</th><th>Status</th></tr></thead>
    <tbody id="tbody-registros"></tbody></table>
  </div>
</div>

<div id="alfa" class="view" style="display:none">
  <div class="card">
    <h3>Caveiras</h3>
    <table class="table"><tbody id="tbody-cia-alfa"></tbody></table>
  </div>
</div>

<div id="bravo" class="view" style="display:none">
  <div class="card">
    <h3>Boinas Pretas</h3>
    <table class="table"><tbody id="tbody-cia-bravo"></tbody></table>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ilonwkgtdszmpcjwlezc.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlsb253a2d0ZHN6bXBjandsZXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5NzQxMDIsImV4cCI6MjA3NTU1MDEwMn0.Cc-BtnHlXaGVCY6T6iXe0QA1tsfc17aX8lswEICvtw0";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let allReports = [];

async function init(){
  const { data } = await sb.auth.getUser();
  if(!data?.user){ location.href="login.html"; return; }

  loadReports();
}

async function loadReports(){
  const { data } = await sb.from("rota_reports").select("*");
  allReports = data || [];
  render();
}

function render(){
  let p=0,a=0,r=0,ar=0;

  document.getElementById("tbody-registros").innerHTML = "";
  document.getElementById("tbody-cia-alfa").innerHTML = "";
  document.getElementById("tbody-cia-bravo").innerHTML = "";

  allReports.forEach(x=>{
    if(x.status==="Pendente") p++;
    if(x.status==="Em análise") a++;
    if(x.status==="Resolvido") r++;
    if(x.status==="Arquivado") ar++;

    const row = `<tr>
      <td>${new Date(x.created_at).toLocaleString()}</td>
      <td>${x.officer_name}</td>
      <td>${x.company}</td>
      <td>${x.status}</td>
    </tr>`;

    document.getElementById("tbody-registros").innerHTML += row;
    if(x.company==="Caveiras") document.getElementById("tbody-cia-alfa").innerHTML += row;
    if(x.company==="Boinas Pretas") document.getElementById("tbody-cia-bravo").innerHTML += row;
  });

  document.getElementById("stat-pendente").innerText = p;
  document.getElementById("stat-analise").innerText = a;
  document.getElementById("stat-resolvido").innerText = r;
  document.getElementById("stat-arquivado").innerText = ar;
}

function showView(view){
  document.querySelectorAll(".view").forEach(v=>v.style.display="none");
  document.getElementById(view).style.display="block";
}

async function logout(){
  await sb.auth.signOut();
  location.href="login.html";
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
